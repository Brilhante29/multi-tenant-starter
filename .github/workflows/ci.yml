name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build Docker image
        run: docker build -t multi-tenant-starter .

      - name: Run benchmark in Docker
        run: docker run --rm multi-tenant-starter benchmark

      - name: Verify benchmark output
        run: |
          docker run --rm multi-tenant-starter benchmark 2>&1 | head -1 | grep -q "tenant_onboarding_seconds" && echo "Benchmark output valid"
