name: CI

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main, "codex/**", "agent/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build Docker image
        run: docker build -t multi-tenant-starter .

      - name: Run benchmark in Docker
        run: docker run --rm multi-tenant-starter benchmark

      - name: Verify benchmark output
        run: |
          docker run --rm multi-tenant-starter benchmark 2>&1 \
            | grep -F '"metric":"tenant_onboarding_seconds"' \
            | tail -1 > benchmark-line.json
          python3 -m json.tool benchmark-line.json >/dev/null
          echo "Benchmark output valid"
