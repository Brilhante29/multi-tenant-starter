name: CI

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: PostgreSQL isolation tests
        run: docker compose -p multi-tenant-starter-ci --profile test run --rm test

      - name: REST smoke test
        shell: bash
        run: |
          docker compose -p multi-tenant-starter-smoke up --build -d app
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p multi-tenant-starter-smoke logs app
          exit 1

      - name: Benchmark V2
        env:
          BENCHMARK_RESULTS_DIR: ${{ runner.temp }}/multi-tenant-starter
        run: ./tools/run-benchmark.sh

      - name: Repository validation
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker

      - name: Upload benchmark smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-v2-${{ github.sha }}
          path: ${{ runner.temp }}/multi-tenant-starter/multi-tenant-starter-v2.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker compose -p multi-tenant-starter-ci --profile test down -v --remove-orphans
          docker compose -p multi-tenant-starter-smoke down -v --remove-orphans
          docker compose -p multi-tenant-starter-benchmark down -v --remove-orphans
