server.port=8080
spring.application.name=multi-tenant-starter
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/multitenant}
spring.datasource.username=${DATABASE_USER:multitenant}
spring.datasource.password=${DATABASE_PASSWORD:multitenant}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:12}
spring.flyway.locations=classpath:db/control
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=true
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
