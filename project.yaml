id: 17
name: multi-tenant-starter
program:
  id: backend-reliability-platform
  narrative_fit: Demonstrates schema-per-tenant isolation as a core reliability pattern for multi-tenant SaaS platforms.
  shared_assets:
    - TenantContext scoped execution pattern
    - Benchmark Result V2 contract
status: implementation
claim: PostgreSQL schema-per-tenant isolation with atomic onboarding, rollback, constraints, and concurrent access evidence
stack:
  - java21
  - spring-boot
  - spring-jdbc
  - postgresql17
  - flyway
  - docker
language_profile:
  primary: java
  secondary:
    - spring
  reason: Java and Spring Boot expose the enterprise boundary while Spring JDBC keeps PostgreSQL schema routing and transactional DDL visible.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker+kumo-when-cloud-behavior-is-needed
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: domain/use cases do not depend on framework, database, broker, cloud SDK, transport, or UI
    solid:
      - srp: each domain class has one responsibility
      - ocp: ports extend via new implementations
      - lsp: test doubles and PostgreSQL adapters obey the same narrow port contracts
      - isp: tenant registry, schema provisioning, tenant records, id generation, and transactions are separate ports
      - dip: application services depend only on domain and application ports
    simplicity_rule: Use one PostgreSQL database and one schema per tenant; no broker, ORM, or cloud service is needed for this proof.
    testability_rule: Unit tests exercise use cases through ports; Docker Compose integration tests prove database isolation, rollback, constraints, and concurrency.
    rejected_overengineering:
      - RabbitMQ or Kafka before transactional tenant isolation is implemented
  stack_profile: java-spring-postgresql-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: local-first
    local_provider: docker-postgresql
    real_provider_target: none
    emulated_services: []
    adapter_rule: ports/adapters keep cloud SDK outside domain/use cases
    config_switch: none
    unsupported_behaviors: []
  database: postgresql-17 schema-per-tenant
  runtime: docker-compose
  library_policy: "Spring JDBC exposes transaction and schema boundaries; Flyway owns control-plane migrations; Compose provides PostgreSQL parity without nested-Docker assumptions. JPA and messaging are excluded."
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: in-memory schema simulation
      reason: Cannot prove database constraints, transactional DDL, rollback, or tenant leakage prevention.
    - option: Hibernate multi-tenancy
      reason: Hides the SQL and connection boundaries that this repository exists to prove.
architecture:
  style: hexagonal
  reason: Ports/adapters isolate tenant policy from REST and PostgreSQL while keeping schema routing and transactional DDL explicit and testable.
  problem_forces:
    domain_complexity: low
    integration_pressure: high
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: medium
    throughput_or_async: medium
    independent_deployability: high
  dependency_rule: domain defines ports (interfaces), application depends on domain, infrastructure depends on domain ports
  boundaries:
    - domain: Tenant, TenantRecord, TenantContext, repository and provisioning ports
    - application: TenantService, TenantDataService, TransactionRunner
    - infrastructure: PostgreSQL adapters, Flyway control migration, REST transport
    - benchmark: real onboarding and isolated-query workload with integrity counters
  rejected_alternatives:
    - style: layered
      reason: Does not enforce port/adapter boundaries, making multi-tenant isolation harder to test independently.
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: false
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: tenant_onboarding_p50_ms
  unit: milliseconds
  command: ./tools/run-benchmark.ps1
  result_path: benchmarks/results/multi-tenant-starter-v2.json
release:
  docker: implemented
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
