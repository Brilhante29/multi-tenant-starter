id: 17
name: multi-tenant-starter
program:
  id: backend-reliability-platform
  narrative_fit: Demonstrates schema-per-tenant isolation as a core reliability pattern for multi-tenant SaaS platforms.
  shared_assets:
    - TenantContext ThreadLocal utility
    - DataSourceRouter port/contract
status: implemented
claim: schema-per-tenant architecture prototype; real PostgreSQL isolation is pending
stack:
  - java21
  - spring-boot
  - docker
language_profile:
  primary: java
  secondary:
    - spring
  reason: Java and Spring Boot expose the enterprise boundary; PostgreSQL isolation remains the required next implementation.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker+kumo-when-cloud-behavior-is-needed
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: domain/use cases do not depend on framework, database, broker, cloud SDK, transport, or UI
    solid:
      - srp: each domain class has one responsibility
      - ocp: ports extend via new implementations
      - lsp: in-memory adapters satisfy same contracts as real adapters
      - isp: TenantRepository and DataSourceRouter are small focused ports
      - dip: TenantService depends on TenantRepository and SchemaInitializer abstractions
    simplicity_rule: In-memory adapters demonstrate boundaries only; they do not prove database-level tenant isolation.
    testability_rule: Use cases run without transport or infrastructure via Mockito and in-memory adapters.
    rejected_overengineering:
      - RabbitMQ or Kafka before transactional tenant isolation is implemented
  stack_profile: java-spring-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: adapter-fake
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: ports/adapters keep cloud SDK outside domain/use cases
    config_switch: none
    unsupported_behaviors: []
  database: in-memory (simulates schema-per-tenant)
  runtime: docker
  library_policy: "Current prototype uses Spring Boot Web and Actuator. Target implementation adds PostgreSQL, Flyway, JDBC, and Testcontainers."
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: PostgreSQL + Flyway for local demo
      reason: Deferred only while the repository is explicitly a prototype; PostgreSQL and Flyway are required before publication.
architecture:
  style: hexagonal
  reason: Ports/adapters isolate the multi-tenant domain from the transport (REST) and persistence (in-memory) concerns, allowing the schema-per-tenant pattern to be tested without infrastructure.
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: low
    throughput_or_async: low
    independent_deployability: high
  dependency_rule: domain defines ports (interfaces), application depends on domain, infrastructure depends on domain ports
  boundaries:
    - domain: Tenant, TenantContext, TenantRepository, DataSourceRouter
    - application: TenantService, TenantController, HealthController
    - infrastructure: InMemoryTenantRepository, InMemoryDataSourceRouter, SchemaInitializer, SimpleMigrationRunner
    - benchmark: TenantBenchmark, BenchmarkResult
  rejected_alternatives:
    - style: layered
      reason: Does not enforce port/adapter boundaries, making multi-tenant isolation harder to test independently.
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: false
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: tenant_onboarding_seconds
  unit: seconds
  command: docker run --rm multi-tenant-starter benchmark
  result_path: benchmarks/results/benchmark.json
release:
  docker: implemented
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
